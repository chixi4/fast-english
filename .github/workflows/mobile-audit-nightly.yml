name: Mobile Audit Nightly

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Run full mobile audit
        env:
          PYTHONPATH: ${{ github.workspace }}
          RUN_E2E_MOBILE: "1"
          E2E_MAX_CLICKS: "12"
          E2E_STRICT: "1"
        run: |
          pytest tests/e2e_mobile/test_mobile_navigation_audit.py -q
