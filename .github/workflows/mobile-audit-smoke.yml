name: Mobile Audit Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m playwright install chromium

      - name: Run core regression
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_auth_feedback.py tests/test_onboarding_state.py tests/test_worksheets_question_types.py tests/test_worksheets_reading.py -q

      - name: Run mobile smoke audit
        env:
          PYTHONPATH: ${{ github.workspace }}
          RUN_E2E_MOBILE: "1"
          E2E_MAX_CLICKS: "4"
          E2E_STRICT: "1"
        run: |
          pytest tests/e2e_mobile/test_mobile_navigation_audit.py -q
