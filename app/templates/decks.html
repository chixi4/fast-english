{% extends "base.html" %}
{% block content %}
  <h1 class="title-accent">词书</h1>

  {% if toast %}
    <div class="card">{{ toast }}</div>
  {% endif %}

  <div class="actions actions-full">
    <a class="btn primary" href="/library">导入词书</a>
  </div>

  <div class="fullbleed divider-bar"></div>

  <h2>已有词书</h2>
  <div class="deck-mobile">
    {% for item in items %}
      <div class="card">
        <div class="deck-title">
          <a href="/decks/{{ item.deck.id }}"><strong>{{ item.deck.name }}</strong></a>
        </div>
        <div class="deck-actions">
          <a class="btn" href="/decks/{{ item.deck.id }}">查看详情</a>
        </div>
      </div>
    {% endfor %}
  </div>

  <div class="fullbleed divider-tail"></div>
{% endblock %}
