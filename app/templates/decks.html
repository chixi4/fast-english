{% extends "base.html" %}
{% block content %}
  <h1>词书</h1>

  {% if toast %}
    <div class="card">{{ toast }}</div>
  {% endif %}

  <div class="actions">
    <a class="btn primary" href="/library">导入词书</a>
  </div>

  <h2>已有词书</h2>
  <div class="only-desktop">
    <table class="table">
      <thead>
        <tr>
          <th>名称</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
          <tr>
            <td><a href="/decks/{{ item.deck.id }}">{{ item.deck.name }}</a></td>
            <td>
              <div class="actions">
                <a class="btn primary" href="/review?deck_id={{ item.deck.id }}">开始学习</a>
                <a class="btn" href="/decks/{{ item.deck.id }}">详情</a>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="only-mobile deck-mobile">
    {% for item in items %}
      <div class="card">
        <div class="deck-title">
          <a href="/decks/{{ item.deck.id }}"><strong>{{ item.deck.name }}</strong></a>
        </div>
        <div class="deck-actions">
          <a class="btn primary" href="/review?deck_id={{ item.deck.id }}">开始学习</a>
          <details class="deck-more">
            <summary class="btn">更多</summary>
            <div class="deck-more-panel">
              <a class="btn" href="/decks/{{ item.deck.id }}">查看详情</a>
            </div>
          </details>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
