<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1c1e" />
    <title>{{ title or "Vocabulary Study MVP" }}</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_v() }}" />
    <script defer src="/static/htmx.min.js?v={{ static_v() }}"></script>
  </head>
  <body style="background:#1c1c1e;color:#f5f5f7" hx-boost="true" hx-target="#content" hx-select="#content" hx-swap="outerHTML" hx-indicator="#loading">
    <div id="loading" class="htmx-indicator"></div>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <a href="/">Vocabulary Study</a>
        </div>

        {% if request.state.user_username %}
          <nav class="nav">
            <a href="/">今日</a>
            <a href="/decks">词书</a>
            <a href="/practice">练习</a>
            <a href="/settings">我的</a>
          </nav>
        {% endif %}
      </div>
    </header>

    <main id="content" class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="container footer">
      <div class="muted"></div>
    </footer>

  </body>
</html>
