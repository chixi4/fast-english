<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Vocabulary Study MVP" }}</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <a href="/">Vocabulary Study</a>
        </div>

        {% if request.state.user_username %}
          <nav class="nav">
            <a href="/">浠婃棩</a>
            <a href="/decks">璇嶄功</a>
            <a href="/practice">缁冧範</a>
            <a href="/settings">鎴戠殑</a>
          </nav>
          <div class="userbar">
            <a class="userchip" href="/settings">@{{ request.state.user_username }}</a>
            <form method="post" action="/auth/logout" style="margin:0;">
              <button class="btn" type="submit">退出</button>
            </form>
          </div>
        {% endif %}
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="container footer">
      <div class="muted"></div>
    </footer>

  </body>
</html>
