<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1c1c1e" />
    <title>{{ title or "迅捷单词" }}</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_v() }}" />
    <script>
      // Used for CSS fallbacks (avoid first-paint native selects before we enhance them).
      document.documentElement.classList.add('js');
    </script>
    <script defer src="/static/htmx.min.js?v={{ static_v() }}"></script>
    <script defer src="/static/analytics_dashboard.js?v={{ static_v() }}"></script>
  </head>
  <body style="background:#1c1c1e;color:#f5f5f7" hx-boost="true" hx-target="#content" hx-select="#content" hx-swap="outerHTML" hx-indicator="#loading">
    <div id="loading" class="htmx-indicator"></div>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">
          <a href="/">
            <span class="brand-accent">迅捷</span><span class="brand-text">单词</span>
          </a>
        </div>

        <nav class="nav">
          {% set is_parent_mode = request.state.ui_mode == 'parent' %}
          {% if is_parent_mode %}
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">今日作业</a>
            <a href="/worksheets" class="{% if request.url.path.startswith('/worksheets') %}active{% endif %}">作业</a>
            <a href="/dashboard" class="{% if request.url.path.startswith('/dashboard') %}active{% endif %}">进度</a>
            <a href="/settings" class="{% if request.url.path.startswith('/settings') %}active{% endif %}">设置</a>
          {% else %}
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">今日</a>
            <a href="/decks" class="{% if request.url.path.startswith('/decks') %}active{% endif %}">词书</a>
            <a href="/practice" class="{% if request.url.path == '/practice' %}active{% endif %}">练习</a>
            <a href="/worksheets" class="{% if request.url.path.startswith('/worksheets') %}active{% endif %}">作业</a>
            <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">我的</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main id="content">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    {% block scripts %}{% endblock %}
    <script>
      function setActiveNav() {
        const nav = document.querySelector('.nav');
        if (!nav) return;
        const path = window.location.pathname || '/';
        nav.querySelectorAll('a').forEach((a) => {
          let hrefPath = '/';
          try { hrefPath = new URL(a.getAttribute('href'), window.location.origin).pathname || '/'; } catch {}
          const isRoot = hrefPath === '/';
          const on = isRoot ? path === '/' : (path === hrefPath || path.startsWith(hrefPath + '/'));
          a.classList.toggle('active', on);
          if (on) a.setAttribute('aria-current', 'page');
          else a.removeAttribute('aria-current');
        });
      }

      // When navigating via HTMX (hx-boost), keep UX consistent: the inner scroller starts at top.
      // This avoids odd scroll snaps when switching to a long page like "我的".
      document.addEventListener('DOMContentLoaded', () => {
        if (window.htmx) {
          // We'll manage the scroll position ourselves.
          window.htmx.config.scrollIntoViewOnBoost = false;
        }
        setActiveNav();
      });

      document.addEventListener('htmx:afterSwap', (e) => {
        const target = e?.detail?.target;
        if (!target || target.id !== 'content') return;
        target.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        setActiveNav();
      });

      document.addEventListener('htmx:pushedIntoHistory', setActiveNav);
      document.addEventListener('htmx:replacedInHistory', setActiveNav);
      window.addEventListener('popstate', setActiveNav);

      // Close the deck picker (<details>) when tapping/clicking outside.
      const closeOpenDeckPickers = (target) => {
        document.querySelectorAll('details.deck-picker[open]').forEach((d) => {
          if (target && d.contains(target)) return;
          d.removeAttribute('open');
        });
      };

      document.addEventListener('click', (e) => {
        closeOpenDeckPickers(e.target);
      }, { capture: true });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        closeOpenDeckPickers(null);
      }, { capture: true });

      // Unify all <select> menus into the same deck-picker (<details>) UI.
      function enhanceSelectMenus(root) {
        const scope = root && root.querySelectorAll ? root : document;
        const selects = scope.querySelectorAll('select');
        selects.forEach((sel) => {
          if (!(sel instanceof HTMLSelectElement)) return;
          if (sel.multiple) return;
          if (sel.dataset.vsPicker === '1') return;
          if (sel.getAttribute('data-native') === '1') return;

          // If already replaced (e.g. after back/forward), skip.
          const next = sel.nextElementSibling;
          if (next && next.matches && next.matches('details.deck-picker.vs-select-picker')) {
            sel.dataset.vsPicker = '1';
            return;
          }

          const key = sel.dataset.vsSelectKey || sel.id || sel.name || `vs_sel_${Math.random().toString(36).slice(2, 10)}`;
          sel.dataset.vsSelectKey = key;

          const details = document.createElement('details');
          details.className = 'deck-picker vs-select-picker';
          details.dataset.vsFor = key;

          const summary = document.createElement('summary');
          summary.className = 'deck-picker-summary';

          const menu = document.createElement('div');
          menu.className = 'deck-picker-menu';
          menu.setAttribute('role', 'listbox');
          menu.setAttribute('aria-label', (sel.name || sel.id || '选择') + ' 菜单');

          const getSelectedText = () => {
            const opt = sel.selectedOptions && sel.selectedOptions.length ? sel.selectedOptions[0] : null;
            return (opt && opt.textContent ? opt.textContent : '') || '';
          };
          summary.textContent = getSelectedText();

          Array.from(sel.options || []).forEach((opt) => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'deck-picker-item';
            item.textContent = (opt.textContent || '').trim();
            item.disabled = !!opt.disabled;
            item.setAttribute('role', 'option');
            item.setAttribute('aria-selected', opt.selected ? 'true' : 'false');
            item.addEventListener('click', () => {
              if (item.disabled) return;
              sel.value = opt.value;
              // Update aria-selected in the menu
              menu.querySelectorAll('[role="option"]').forEach((n) => n.setAttribute('aria-selected', 'false'));
              item.setAttribute('aria-selected', 'true');
              summary.textContent = getSelectedText();
              details.removeAttribute('open');
              sel.dispatchEvent(new Event('change', { bubbles: true }));
            });
            menu.appendChild(item);
          });

          details.appendChild(summary);
          details.appendChild(menu);

          // Hide native select but keep it for form submission and validation.
          // Important: if the <select> is inside a <label>, moving it out avoids the label click
          // triggering the native platform picker on some mobile browsers.
          sel.style.display = 'none';
          sel.dataset.vsPicker = '1';
          sel.setAttribute('aria-hidden', 'true');
          sel.tabIndex = -1;

          const label = sel.closest('label');
          if (label && label.contains(sel) && !label.getAttribute('for')) {
            sel.replaceWith(details); // keep the picker where the select visually was
            label.insertAdjacentElement('afterend', sel); // park the hidden select outside the label
          } else {
            sel.insertAdjacentElement('afterend', details);
          }
        });
      }
      // Make callable from swapped-in content scripts (HTMX only swaps #content).
      window.enhanceSelectMenus = enhanceSelectMenus;

      // Run on initial load, HTMX swaps, HTMX history restores, and any late DOM insertions.
      const runEnhanceSoon = (() => {
        let scheduled = false;
        return (root) => {
          if (scheduled) return;
          scheduled = true;
          Promise.resolve().then(() => {
            scheduled = false;
            enhanceSelectMenus(root || document);
          });
        };
      })();

      document.addEventListener('DOMContentLoaded', () => {
        runEnhanceSoon(document);
        const content = document.getElementById('content');
        if (content && window.MutationObserver) {
          const obs = new MutationObserver(() => runEnhanceSoon(content));
          obs.observe(content, { childList: true, subtree: true });
        }
      });

      // Fires for boosted navigation + partial swaps.
      document.addEventListener('htmx:afterSwap', (e) => {
        const target = e?.detail?.target;
        if (!target) return;
        runEnhanceSoon(target);
      });

      // Fires on history restore from cache.
      document.addEventListener('htmx:load', (e) => {
        const elt = e?.detail?.elt;
        if (!elt) return;
        runEnhanceSoon(elt);
      });

      // Covers bfcache restores on some mobile browsers.
      window.addEventListener('pageshow', () => runEnhanceSoon(document));

      // Safety net: if a native <select> somehow survives (timing/history quirks), intercept the first tap
      // and replace it on-demand so the user never sees the system picker.
      document.addEventListener('pointerdown', (e) => {
        const target = e.target;
        if (!(target instanceof Element)) return;
        const sel = target.closest('select');
        if (!sel || !(sel instanceof HTMLSelectElement)) return;
        if (sel.multiple) return;
        if (sel.getAttribute('data-native') === '1') return;
        if (sel.dataset.vsPicker === '1') return;

        e.preventDefault();
        e.stopPropagation();

        enhanceSelectMenus(document);
        const key = sel.dataset.vsSelectKey || sel.id || sel.name || '';
        if (!key) return;
        const details = document.querySelector(`details.deck-picker.vs-select-picker[data-vs-for="${CSS.escape(key)}"]`);
        if (!details) return;
        details.setAttribute('open', '');
        const summary = details.querySelector('summary');
        if (summary && summary.focus) summary.focus({ preventScroll: true });
      }, { capture: true });
    </script>
    <script>
      (() => {
        const ENDPOINT = '/api/analytics/events';
        const SID_KEY = 'vs_sid';

        const safeText = (s, max = 80) => {
          const t = String(s || '').replace(/\s+/g, ' ').trim();
          return t.length > max ? t.slice(0, max) : t;
        };

        const looksSensitive = (name, type) => {
          const n = String(name || '').toLowerCase();
          const t = String(type || '').toLowerCase();
          if (t === 'password') return true;
          return /(pass|passwd|password|pwd|token|secret|api[_-]?key|apikey|key)/i.test(n);
        };

        const randId = () => {
          try {
            if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
          } catch {}
          return `${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
        };

        const getSid = () => {
          try {
            const cur = sessionStorage.getItem(SID_KEY);
            if (cur) return cur;
            const sid = randId();
            sessionStorage.setItem(SID_KEY, sid);
            return sid;
          } catch {
            return randId();
          }
        };

        const sid = getSid();
        const pid = randId();

        let q = [];
        let timer = null;

        const enqueue = (ev) => {
          try {
            q.push(ev);
            if (q.length >= 30) flush();
            else schedule();
          } catch {}
        };

        const schedule = () => {
          if (timer) return;
          timer = window.setTimeout(flush, 700 + Math.random() * 500);
        };

        const flush = () => {
          if (timer) {
            clearTimeout(timer);
            timer = null;
          }
          if (!q.length) return;

          const batch = q.splice(0, 200);
          const body = JSON.stringify({
            sid,
            pid,
            url: window.location.href,
            events: batch,
          });

          try {
            if (navigator.sendBeacon) {
              navigator.sendBeacon(ENDPOINT, new Blob([body], { type: 'application/json' }));
              return;
            }
          } catch {}

          try {
            fetch(ENDPOINT, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body,
              keepalive: true,
              credentials: 'same-origin',
            }).catch(() => {});
          } catch {}
        };

        window.addEventListener('pagehide', flush);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') flush();
        });

        const elInfo = (el) => {
          if (!el || !(el instanceof Element)) return null;
          const tag = (el.tagName || '').toLowerCase();
          const id = el.id ? String(el.id).slice(0, 60) : '';
          const cls = el.className ? safeText(el.className, 80) : '';
          const name = el.getAttribute('name') || '';
          const role = el.getAttribute('role') || '';
          const href = (tag === 'a' ? (el.getAttribute('href') || '') : '');
          const text = safeText(el.textContent || '', 80);
          return { tag, id, cls, name, role, href: href.slice(0, 200), text };
        };

        // Page-level snapshot
        enqueue({
          t: 'page',
          ts: Date.now(),
          path: window.location.pathname || '/',
          v: {
            w: window.innerWidth,
            h: window.innerHeight,
            dpr: window.devicePixelRatio || 1,
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
            lang: navigator.language || '',
          },
        });

        // Clicks
        document.addEventListener('click', (e) => {
          const el = (e.target instanceof Element) ? e.target.closest('a,button,input,select,textarea,label,[role]') : null;
          enqueue({
            t: 'click',
            ts: Date.now(),
            path: window.location.pathname || '/',
            el: elInfo(el),
          });
        }, { capture: true, passive: true });

        // Form submits
        document.addEventListener('submit', (e) => {
          const form = e.target;
          enqueue({
            t: 'submit',
            ts: Date.now(),
            path: window.location.pathname || '/',
            el: elInfo(form),
            action: (form && form.getAttribute) ? (form.getAttribute('action') || '') : '',
          });
        }, true);

        // Inputs/changes (redact obvious secrets)
        document.addEventListener('change', (e) => {
          const el = e.target;
          if (!(el instanceof HTMLInputElement || el instanceof HTMLSelectElement || el instanceof HTMLTextAreaElement)) return;
          const name = el.name || el.id || '';
          const type = (el instanceof HTMLInputElement) ? (el.type || '') : (el instanceof HTMLSelectElement ? 'select' : 'textarea');
          const val = looksSensitive(name, type) ? '[redacted]' : safeText(el.value, 120);
          enqueue({
            t: 'change',
            ts: Date.now(),
            path: window.location.pathname || '/',
            el: elInfo(el),
            f: { name, type, len: String(el.value || '').length, val },
          });
        }, true);

        // Global errors
        window.addEventListener('error', (e) => {
          enqueue({
            t: 'error',
            ts: Date.now(),
            path: window.location.pathname || '/',
            msg: safeText(e && e.message, 200),
            src: safeText(e && e.filename, 120),
            ln: e && e.lineno,
            cn: e && e.colno,
          });
        });
        window.addEventListener('unhandledrejection', (e) => {
          const reason = e && e.reason;
          enqueue({
            t: 'rejection',
            ts: Date.now(),
            path: window.location.pathname || '/',
            msg: safeText(reason && (reason.message || String(reason)), 200),
          });
        });

        // HTMX network lifecycle (if used)
        const xhrStart = new WeakMap();
        document.addEventListener('htmx:beforeRequest', (e) => {
          try {
            const xhr = e.detail && e.detail.xhr;
            if (xhr) xhrStart.set(xhr, performance.now());
            enqueue({
              t: 'htmx_before',
              ts: Date.now(),
              path: window.location.pathname || '/',
              req: {
                method: safeText(e.detail && e.detail.verb, 12),
                path: safeText(e.detail && e.detail.path, 200),
                target: (e.detail && e.detail.target && e.detail.target.id) ? String(e.detail.target.id) : '',
              },
            });
          } catch {}
        });
        document.addEventListener('htmx:afterRequest', (e) => {
          try {
            const xhr = e.detail && e.detail.xhr;
            const startedAt = xhr ? xhrStart.get(xhr) : null;
            const dt = (startedAt != null) ? Math.max(0, Math.round(performance.now() - startedAt)) : 0;
            const status = xhr ? xhr.status : 0;
            enqueue({
              t: 'htmx_after',
              ts: Date.now(),
              dt_ms: dt,
              path: window.location.pathname || '/',
              resp: { status },
            });
          } catch {}
        });

        // Flush a bit after load to capture early actions without feeling laggy.
        window.setTimeout(() => flush(), 1500);
      })();
    </script>
  </body>
</html>
