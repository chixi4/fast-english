{% extends "base.html" %}
{% block content %}
  <h1>练习</h1>

  {% if word_count == 0 %}
    <div class="card">
      <div class="muted">还没有单词</div>
      <div class="actions">
        <a class="btn primary" href="/library">导入词书</a>
        <a class="btn" href="/words">手动导入</a>
      </div>
    </div>
  {% else %}
    <div class="cards">
      <div class="card">
        <div class="card-k">错词篮</div>
        <div class="card-v">{{ mistake_count }}</div>
        <div class="actions">
          <a class="btn primary" href="/mistakes">开始</a>
        </div>
      </div>

      <div class="card">
        <div class="card-k">实战短文</div>
        <div class="card-v">{{ sim_count }}</div>
        <div class="actions">
          <a class="btn" href="/simulations">查看</a>
        </div>
      </div>

      <div class="card">
        <div class="card-k">单词库</div>
        <div class="card-v">{{ word_count }}</div>
        <div class="actions">
          <a class="btn" href="/words">管理</a>
        </div>
      </div>
    </div>
    <div class="fullbleed divider-tail"></div>
  {% endif %}
{% endblock %}
