{% extends "base.html" %}
{% block content %}
  <h1>词书库</h1>

  <div class="library-list">
    {% for s in sources %}
      <div class="card library-item">
        <div class="library-left">
          <div class="library-name">{{ s.name }}</div>
        </div>
        <form class="library-right" method="post" action="/library/import">
          <input type="hidden" name="source_id" value="{{ s.id }}" />
          <input type="hidden" name="deck_name" value="{{ s.default_deck }}" />
          <input type="hidden" name="default_tags" value="{{ s.default_tags }}" />
          <input type="hidden" name="on_conflict" value="skip" />
          <button class="btn" type="submit">导入</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% endblock %}
