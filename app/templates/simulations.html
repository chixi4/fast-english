{% extends "base.html" %}
{% block content %}
  <h1>实战短文</h1>

  <table class="table" data-mobile-cards="1" data-audit-id="simulations-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>难度</th>
        <th>错词</th>
        <th>时间</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
        <tr>
          <td class="mono" data-col-label="ID"><a href="/simulations/{{ item.sim.id }}">#{{ item.sim.id }}</a></td>
          <td class="mono" data-col-label="难度">{{ level_labels.get(item.sim.level, item.sim.level) }}</td>
          <td class="mono" data-col-label="错词">{{ ", ".join(item.terms) }}</td>
          <td class="mono" data-col-label="时间">{{ item.sim.created_at }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
