{% extends "base.html" %}
{% block content %}
  <h1>导入结果</h1>
  <div class="cards">
    <div class="card">
      <div class="card-k">总条数</div>
      <div class="card-v">{{ total }}</div>
    </div>
    <div class="card">
      <div class="card-k">新增</div>
      <div class="card-v">{{ inserted }}</div>
    </div>
    <div class="card">
      <div class="card-k">更新</div>
      <div class="card-v">{{ updated }}</div>
    </div>
    <div class="card">
      <div class="card-k">跳过</div>
      <div class="card-v">{{ skipped }}</div>
    </div>
    <div class="card">
      <div class="card-k">已关联</div>
      <div class="card-v">{{ linked }}</div>
    </div>
  </div>

  {% if errors and errors|length > 0 %}
    <h2>提示</h2>
    <div class="card">
      <ul>
        {% for e in errors %}
          <li class="muted">{{ e }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}

  <div class="actions">
    <a class="btn primary" href="/">回到今日</a>
    <a class="btn" href="/decks">查看词书</a>
    <a class="btn" href="/library">继续导入</a>
  </div>
{% endblock %}
