{% extends "base.html" %}
{% block content %}
  <h1>单词库</h1>

  <form class="row" method="get" action="/words">
    <input name="q" placeholder="搜索..." value="{{ q }}" />
    <button class="btn" type="submit">搜索</button>
  </form>

  <h2>添加单词</h2>
  <form class="stack" method="post" action="/words">
    <label>单词<input name="term" required /></label>
    <label>释义<textarea name="definition" rows="2"></textarea></label>
    <label>例句<textarea name="example" rows="2"></textarea></label>
    <label>标签<input name="tags" /></label>
    <label>词书<input name="deck_name" list="deck_names" /></label>
    <label>章节<input name="chapter" /></label>
    <button class="btn primary" type="submit">保存</button>
  </form>

  <h2>批量导入</h2>
  <form class="stack" method="post" action="/words/import" enctype="multipart/form-data">
    <label>导入到词书
      <input name="deck_name" list="deck_names" />
    </label>
    <label>默认标签
      <input name="default_tags" />
    </label>
    <label class="row">
      <input type="checkbox" name="add_to_plan" value="1" />
      <span>导入后加入学习计划</span>
    </label>
    <label>重复处理
      <select name="on_conflict">
        <option value="skip" selected>跳过已存在</option>
        <option value="update">更新已存在</option>
      </select>
    </label>
    <label>上传文件
      <input type="file" name="file" />
    </label>
    <label>或粘贴文本
      <textarea name="text" rows="6" placeholder="term,definition,example..."></textarea>
    </label>
    <button class="btn primary" type="submit">导入</button>
  </form>

  <datalist id="deck_names">
    {% for d in decks %}
      <option value="{{ d.name }}"></option>
    {% endfor %}
  </datalist>

  <h2>最近添加</h2>
  <table class="table" data-mobile-cards="1" data-audit-id="words-table">
    <thead>
      <tr>
        <th>单词</th>
        <th>释义</th>
        <th>正确/错误</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for w in words %}
        <tr>
          <td class="mono" data-col-label="单词">{{ w.term }}</td>
          <td data-col-label="释义">{{ w.definition }}</td>
          <td class="mono" data-col-label="正确/错误">{{ w.correct_count }}/{{ w.wrong_count }}</td>
          <td data-col-label="操作">
            <form method="post" action="/words/{{ w.id }}/delete" onsubmit="return confirm('删除 {{ w.term }} ?')">
              <button class="btn danger" type="submit">删除</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

  <script>
    // Ensure selects are skinned even on HTMX navigation where only #content is swapped.
    (() => {
      try {
        if (window.enhanceSelectMenus) window.enhanceSelectMenus(document.getElementById('content') || document);
      } catch {}
    })();
  </script>
{% endblock %}
