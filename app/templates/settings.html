{% extends "base.html" %}
{% block content %}
  <h1>我的</h1>

  <div class="cards">
    <div class="card">
      <div class="card-k">AI 状态</div>
      <div class="card-v">{{ ai_status }}</div>
      <div class="muted">Model：<span class="mono">{{ ai_model }}</span></div>
      <div class="muted">Base URL：<span class="mono">{{ ai_base_url }}</span></div>
      <div class="muted">在 <span class="mono">.env</span> 里配置 <span class="mono">AI_API_KEY</span> 或开启 <span class="mono">AI_MOCK=1</span>。</div>
    </div>
    <div class="card">
      <div class="card-k">数据</div>
      <div class="card-v">{{ deck_count }}/{{ word_count }}</div>
      <div class="muted">DB：<span class="mono">{{ db_path }}</span></div>
      <div class="actions">
        <a class="btn" href="/decks">管理词书</a>
        <a class="btn" href="/library">词书库导入</a>
      </div>
    </div>
    <div class="card">
      <div class="card-k">高级入口</div>
      <div class="card-v">Tools</div>
      <div class="muted">手动添加/批量导入、以及调试页面。</div>
      <div class="actions">
        <a class="btn" href="/words">单词库</a>
        <a class="btn" href="/simulations">实战短文</a>
      </div>
    </div>
  </div>
{% endblock %}
